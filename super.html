<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supermarket Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    <h1>🛒 SuperMart</h1>
    <p>Eastlex Management System</p>
    <label>Username</label><input id="lu" autocomplete="off">
    <label>Password</label><input id="lp" type="password">
    <button onclick="login()">Sign In</button>
    <div class="err" id="le"></div>
    <div class="hint">Demo — Admin: <b>admin / admin123</b><br>Cashier: <b>cashier / cash123</b></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <b id="shop"></b>
    <div><span id="who"></span><button id="pwbtn" onclick="pwForm()">🔑 Change Password</button> <button onclick="logout()">Logout</button></div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<div id="modal" class="hidden"><div id="mbox"></div></div>

<script>
/* ================= FRONT-END DATABASE (localStorage) ================= */
const KEY = 'supermart_db';
const seed = () => ({
  settings: {name:'SuperMart Supermarket', address:'Kiambu Road, Kenya', phone:'0700 000 000', tax:16, currency:'KES'},
  users: [
    {id:1, name:'System Admin', username:'admin', password:'admin123', role:'admin'},
    {id:2, name:'Jane Cashier', username:'cashier', password:'cash123', role:'cashier'}],
  suppliers: [
    {id:1, name:'Brookside Dairy', phone:'0711 111 111', email:'sales@brookside.co.ke', address:'Ruiru'},
    {id:2, name:'Unga Distributors', phone:'0722 222 222', email:'orders@unga.co.ke', address:'Nairobi'}],
  products: [
    {id:1, barcode:'1001', name:'Fresh Milk 500ml', category:'Dairy', cost:45, price:60, qty:80, min:20, supplier:1, expiry:'2026-12-20'},
    {id:2, barcode:'1002', name:'Maize Flour 2kg', category:'Grains', cost:110, price:145, qty:60, min:15, supplier:2, expiry:'2027-06-01'},
    {id:3, barcode:'1003', name:'Sugar 1kg', category:'Grocery', cost:130, price:165, qty:8, min:15, supplier:2, expiry:'2027-03-01'},
    {id:4, barcode:'1004', name:'Cooking Oil 1L', category:'Grocery', cost:260, price:320, qty:40, min:10, supplier:2, expiry:'2027-01-15'},
    {id:5, barcode:'1005', name:'Bread (Loaf)', category:'Bakery', cost:50, price:70, qty:30, min:10, supplier:1, expiry:'2026-11-28'}],
  sales: [], seq: {p:6, s:3, u:3, sale:1001}
});
let db = JSON.parse(localStorage.getItem(KEY) || 'null') || seed();
const save = () => localStorage.setItem(KEY, JSON.stringify(db));
save();

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const money = n => db.settings.currency + ' ' + Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
const supName = id => (db.suppliers.find(s => s.id == id) || {}).name || '-';
let me = null, cart = [], view = '';

/* ================= AUTH & ROLE ACCESS ================= */
const MENU = {
  dash:['📊 Dashboard',['admin']], pos:['🧾 Point of Sale',['admin','cashier']],
  products:['📦 Products',['admin','cashier']], suppliers:['🚚 Suppliers',['admin']],
  users:['👥 Staff',['admin']], sales:['💰 Sales',['admin','cashier']], settings:['⚙️ Settings',['admin']]
};
const can = v => MENU[v][1].includes(me.role);
const isAdmin = () => me && me.role === 'admin';

function login(){
  const u = db.users.find(x => x.username === $('#lu').value.trim() && x.password === $('#lp').value);
  if(!u){ $('#le').textContent = 'Invalid username or password'; return; }
  me = u; cart = [];
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#shop').textContent = db.settings.name;
  $('#who').textContent = u.name + ' (' + u.role + ')';
  $('#pwbtn').classList.toggle('hidden', u.role !== 'admin');
  $('#nav').innerHTML = Object.keys(MENU).filter(can).map(k => `<button id="n_${k}" onclick="go('${k}')">${MENU[k][0]}</button>`).join('');
  go(isAdmin() ? 'dash' : 'pos');
}
function logout(){ me = null; $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#lp').value=''; $('#le').textContent=''; }
function go(v){
  if(!me || !can(v)) return;           // access guard
  view = v;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.id === 'n_'+v));
  R[v]();
}

/* ================= MODAL / GENERIC FORM ================= */
const openM = h => { $('#mbox').innerHTML = h; $('#modal').classList.remove('hidden'); };
const closeM = () => $('#modal').classList.add('hidden');
function form(title, fields, cb){
  openM(`<h3>${title}</h3><form id="f"><div class="row2">${fields.map(f => `<div style="${f.full?'grid-column:1/3':''}"><label>${f.l}</label>${
    f.opts ? `<select name="${f.k}">${f.opts.map(o => `<option value="${o[0]}" ${o[0]==f.v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`
           : `<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v ?? '')}" ${f.step?'step="'+f.step+'"':''} required>`}</div>`).join('')}</div>
    <div class="acts"><button type="button" class="sec" onclick="closeM()">Cancel</button><button>Save</button></div></form>`);
  $('#f').onsubmit = e => { e.preventDefault(); const o = {}; fields.forEach(f => o[f.k] = f.t==='number' ? Number(e.target[f.k].value) : e.target[f.k].value.trim()); cb(o); closeM(); };
}
function del(list, id, name){
  if(!isAdmin() || !confirm('Delete ' + name + '?')) return;
  db[list] = db[list].filter(x => x.id !== id); save(); go(view);
}

/* ================= VIEWS ================= */
const R = {};

/* ---- Dashboard (admin) ---- */
R.dash = () => {
  const t = today(), ts = db.sales.filter(s => s.date.slice(0,10) === t);
  const rev = db.sales.reduce((a,s) => a+s.total, 0);
  const profit = db.sales.reduce((a,s) => a + s.items.reduce((x,i) => x + (i.price-i.cost)*i.qty, 0) - s.discAmt, 0);
  const low = db.products.filter(p => p.qty <= p.min);
  const soon = db.products.filter(p => p.expiry && (new Date(p.expiry) - new Date()) / 864e5 <= 30);
  const stockVal = db.products.reduce((a,p) => a + p.cost*p.qty, 0);
  $('#main').innerHTML = `<h2>Dashboard</h2><div class="cards">
    <div class="stat">Today's Sales<b>${money(ts.reduce((a,s)=>a+s.total,0))}</b></div>
    <div class="stat">Total Revenue<b>${money(rev)}</b></div>
    <div class="stat">Estimated Profit<b>${money(profit)}</b></div>
    <div class="stat">Stock Value (cost)<b>${money(stockVal)}</b></div>
    <div class="stat">Products<b>${db.products.length}</b></div>
    <div class="stat w">Low Stock<b>${low.length}</b></div>
    <div class="stat b">Expiring ≤30 days<b>${soon.length}</b></div>
    <div class="stat">Transactions<b>${db.sales.length}</b></div></div>
    <div class="card"><h3>⚠ Low Stock</h3><div class="tw"><table><tr><th>Product</th><th>Qty</th><th>Reorder level</th><th>Supplier</th></tr>
    ${low.map(p => `<tr><td>${esc(p.name)}</td><td class="low">${p.qty}</td><td>${p.min}</td><td>${esc(supName(p.supplier))}</td></tr>`).join('') || '<tr><td colspan=4>All stock levels fine</td></tr>'}</table></div></div>
    <div class="card"><h3>⏳ Expiring Soon</h3><div class="tw"><table><tr><th>Product</th><th>Expiry</th><th>Qty</th></tr>
    ${soon.map(p => `<tr><td>${esc(p.name)}</td><td class="low">${p.expiry}</td><td>${p.qty}</td></tr>`).join('') || '<tr><td colspan=3>None</td></tr>'}</table></div></div>
    <div class="card"><h3>🔑 Password Management</h3>
    <div class="bar"><button onclick="pwForm()">Change My Admin Password</button></div>
    <div class="tw"><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Action</th></tr>
    ${db.users.filter(u => u.id !== me.id).map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${u.role}</td><td><button class="sm" onclick="resetPw(${u.id})">Reset Password</button></td></tr>`).join('') || '<tr><td colspan=4>No other staff accounts</td></tr>'}</table></div></div>`;
};

/* ---- Products (admin: full CRUD, cashier: read-only price check) ---- */
R.products = (q='') => {
  const list = db.products.filter(p => (p.name+p.barcode+p.category).toLowerCase().includes(q.toLowerCase()));
  const a = isAdmin();
  $('#main').innerHTML = `<h2>Products ${a?'& Inventory':'(Price Check)'}</h2><div class="bar">
    <input placeholder="Search name, barcode, category..." value="${esc(q)}" oninput="R.products(this.value);this.focus()">
    ${a?'<button onclick="prodForm()">+ Add Product</button>':''}</div>
    <div class="card tw"><table><tr><th>Barcode</th><th>Name</th><th>Category</th>${a?'<th>Cost</th>':''}<th>Price</th><th>Stock</th>${a?'<th>Reorder</th><th>Supplier</th>':''}<th>Expiry</th>${a?'<th>Actions</th>':''}</tr>
    ${list.map(p => `<tr><td>${esc(p.barcode)}</td><td>${esc(p.name)}</td><td>${esc(p.category)}</td>${a?`<td>${money(p.cost)}</td>`:''}<td>${money(p.price)}</td>
      <td class="${p.qty<=p.min?'low':''}">${p.qty}</td>${a?`<td>${p.min}</td><td>${esc(supName(p.supplier))}</td>`:''}<td>${p.expiry||'-'}</td>
      ${a?`<td><button class="sm" onclick="prodForm(${p.id})">Edit</button><button class="sm sec" onclick="restock(${p.id})">Restock</button><button class="sm bad" onclick="del('products',${p.id},'${esc(p.name).replace(/'/g,'')}')">Del</button></td>`:''}</tr>`).join('')}</table></div>`;
};
function prodForm(id){
  if(!isAdmin()) return;
  const p = db.products.find(x => x.id === id) || {};
  form(id ? 'Edit Product' : 'Add Product', [
    {k:'barcode',l:'Barcode',v:p.barcode}, {k:'name',l:'Name',v:p.name}, {k:'category',l:'Category',v:p.category},
    {k:'supplier',l:'Supplier',v:p.supplier,opts:db.suppliers.map(s=>[s.id,s.name])},
    {k:'cost',l:'Cost Price',t:'number',step:'0.01',v:p.cost}, {k:'price',l:'Selling Price',t:'number',step:'0.01',v:p.price},
    {k:'qty',l:'Quantity',t:'number',v:p.qty}, {k:'min',l:'Reorder Level',t:'number',v:p.min}, {k:'expiry',l:'Expiry Date',t:'date',v:p.expiry,full:true}
  ], o => { o.supplier = Number(o.supplier);
    if(id) Object.assign(p, o); else db.products.push({id: db.seq.p++, ...o});
    save(); R.products(); });
}
function restock(id){
  if(!isAdmin()) return;
  const p = db.products.find(x => x.id === id);
  form('Restock: ' + p.name, [{k:'add',l:'Quantity received',t:'number',v:10,full:true}], o => { p.qty += o.add; save(); R.products(); });
}

/* ---- Suppliers (admin) ---- */
R.suppliers = () => {
  $('#main').innerHTML = `<h2>Suppliers</h2><div class="bar"><button onclick="supForm()">+ Add Supplier</button></div><div class="card tw"><table>
    <tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Actions</th></tr>
    ${db.suppliers.map(s => `<tr><td>${esc(s.name)}</td><td>${esc(s.phone)}</td><td>${esc(s.email)}</td><td>${esc(s.address)}</td>
    <td><button class="sm" onclick="supForm(${s.id})">Edit</button><button class="sm bad" onclick="del('suppliers',${s.id},'supplier')">Del</button></td></tr>`).join('')}</table></div>`;
};
function supForm(id){
  const s = db.suppliers.find(x => x.id === id) || {};
  form(id?'Edit Supplier':'Add Supplier', [{k:'name',l:'Name',v:s.name},{k:'phone',l:'Phone',v:s.phone},{k:'email',l:'Email',t:'email',v:s.email},{k:'address',l:'Address',v:s.address}],
    o => { if(id) Object.assign(s,o); else db.suppliers.push({id:Date.now(),...o}); save(); R.suppliers(); });
}

/* ---- Staff (admin) ---- */
R.users = () => {
  $('#main').innerHTML = `<h2>Staff Accounts</h2><div class="bar"><button onclick="userForm()">+ Add Staff</button></div><div class="card tw"><table>
    <tr><th>Name</th><th>Username</th><th>Role</th><th>Actions</th></tr>
    ${db.users.map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${u.role}</td><td><button class="sm" onclick="userForm(${u.id})">Edit</button>
    ${u.id!==me.id?`<button class="sm bad" onclick="del('users',${u.id},'${esc(u.username)}')">Del</button>`:''}</td></tr>`).join('')}</table></div>`;
};
function userForm(id){
  const u = db.users.find(x => x.id === id) || {};
  form(id?'Edit Staff':'Add Staff', [{k:'name',l:'Full Name',v:u.name},{k:'username',l:'Username',v:u.username},{k:'password',l:'Password',v:u.password},
    {k:'role',l:'Role',v:u.role,opts:[['cashier','Cashier'],['admin','Admin']]}],
    o => { if(db.users.some(x => x.username === o.username && x.id !== id)) return alert('Username taken');
      if(id) Object.assign(u,o); else db.users.push({id:db.seq.u++,...o}); save(); R.users(); });
}

/* ---- Change own password (any logged-in user) ---- */
function pwForm(){
  if(!isAdmin()) return;
  form('Change Password', [
    {k:'cur',l:'Current Password',t:'password',full:true},
    {k:'np',l:'New Password (min 6 characters)',t:'password',full:true},
    {k:'cp',l:'Confirm New Password',t:'password',full:true}
  ], o => {
    const u = db.users.find(x => x.id === me.id);
    if(o.cur !== u.password) return alert('Current password is incorrect');
    if(o.np.length < 6) return alert('New password must be at least 6 characters');
    if(o.np !== o.cp) return alert('Passwords do not match');
    u.password = o.np; save(); alert('Password changed successfully');
  });
}

/* ---- Admin resets a cashier's password (admin only) ---- */
function resetPw(id){
  if(!isAdmin()) return;
  const u = db.users.find(x => x.id === id); if(!u) return;
  form('Reset Password: ' + u.name, [
    {k:'np',l:'New Password (min 6 characters)',t:'password',full:true},
    {k:'cp',l:'Confirm New Password',t:'password',full:true}
  ], o => {
    if(o.np.length < 6) return alert('Password must be at least 6 characters');
    if(o.np !== o.cp) return alert('Passwords do not match');
    u.password = o.np; save(); alert('Password for ' + u.username + ' has been changed');
  });
}

/* ---- Point of Sale ---- */
R.pos = (q='') => {
  const list = db.products.filter(p => (p.name+p.barcode).toLowerCase().includes(q.toLowerCase()));
  $('#main').innerHTML = `<h2>Point of Sale</h2><div class="pos"><div class="card">
    <input placeholder="Search or type barcode + Enter" value="${esc(q)}" id="sq" oninput="R.pos(this.value);$('#sq').focus()" onkeydown="if(event.key==='Enter')scan(this.value)">
    <div class="items" style="margin-top:12px">${list.map(p => `<div class="item" onclick="add(${p.id})"><b>${esc(p.name)}</b><small>${money(p.price)}</small><small class="${p.qty<=p.min?'low':''}">Stock: ${p.qty}</small></div>`).join('')}</div></div>
    <div class="card" id="cartbox"></div></div>`;
  drawCart();
};
const scan = c => { const p = db.products.find(x => x.barcode === c.trim()); if(p) add(p.id); };
function add(id){
  const p = db.products.find(x => x.id === id), l = cart.find(x => x.id === id);
  if(p.qty < 1 || (l && l.qty >= p.qty)) return alert('Not enough stock');
  l ? l.qty++ : cart.push({id, name:p.name, price:p.price, cost:p.cost, qty:1}); drawCart();
}
function setQty(id, v){
  const l = cart.find(x => x.id === id), p = db.products.find(x => x.id === id); v = Math.floor(Number(v));
  if(v > p.qty){ alert('Only ' + p.qty + ' in stock'); v = p.qty; }
  if(v < 1) cart = cart.filter(x => x.id !== id); else l.qty = v; drawCart();
}
function totals(){
  const sub = cart.reduce((a,i) => a + i.price*i.qty, 0);
  const d = Math.min(100, Math.max(0, Number(($('#disc')||{}).value) || 0));
  const discAmt = sub * d / 100, taxable = sub - discAmt, tax = taxable * db.settings.tax / (100 + db.settings.tax); // prices are VAT-inclusive
  return {sub, d, discAmt, tax, total: taxable};
}
function drawCart(){
  const box = $('#cartbox'); if(!box) return;
  const dv = ($('#disc')||{}).value || 0, pv = ($('#paid')||{}).value || '', mv = ($('#meth')||{}).value || 'Cash';
  box.innerHTML = `<h3>Current Sale</h3><div class="tw"><table><tr><th>Item</th><th>Qty</th><th>Total</th></tr>
    ${cart.map(i => `<tr><td>${esc(i.name)}<br><small>${money(i.price)}</small></td><td><input class="qty" type="number" min="0" value="${i.qty}" onchange="setQty(${i.id},this.value)"></td><td>${money(i.price*i.qty)}</td></tr>`).join('') || '<tr><td colspan=3>Cart is empty</td></tr>'}</table></div>
    <label>Discount %</label><input id="disc" type="number" min="0" max="100" value="${dv}" oninput="calc()">
    <label>Payment Method</label><select id="meth"><option>Cash</option><option>M-Pesa</option><option>Card</option></select>
    <label>Amount Paid</label><input id="paid" type="number" step="0.01" value="${pv}" oninput="calc()">
    <div class="tot" id="tot"></div><div class="acts"><button class="sec" onclick="cart=[];drawCart()">Clear</button><button onclick="checkout()">Complete Sale</button></div>`;
  $('#meth').value = mv; calc();
}
function calc(){
  const t = totals(), paid = Number($('#paid').value) || 0;
  $('#tot').innerHTML = `<div><span>Subtotal</span><span>${money(t.sub)}</span></div><div><span>Discount (${t.d}%)</span><span>-${money(t.discAmt)}</span></div>
    <div><span>VAT included (${db.settings.tax}%)</span><span>${money(t.tax)}</span></div><div class="g"><span>TOTAL</span><span>${money(t.total)}</span></div>
    <div><span>Change</span><span>${money(Math.max(0, paid - t.total))}</span></div>`;
}
function checkout(){
  if(!cart.length) return alert('Cart is empty');
  const t = totals(), paid = Number($('#paid').value) || 0, meth = $('#meth').value;
  if(meth === 'Cash' && paid < t.total) return alert('Amount paid is less than total');
  const sale = {id: db.seq.sale++, date: new Date().toISOString(), cashier: me.name, cashierId: me.id, items: cart.map(i => ({...i})),
    sub: t.sub, disc: t.d, discAmt: t.discAmt, tax: t.tax, total: t.total, method: meth, paid: meth==='Cash'?paid:t.total, change: meth==='Cash'?paid-t.total:0};
  sale.items.forEach(i => db.products.find(p => p.id === i.id).qty -= i.qty);
  db.sales.push(sale); save(); cart = []; receipt(sale); R.pos();
}
function receipt(s){
  const st = db.settings;
  openM(`<div class="rcpt"><h3>${esc(st.name)}</h3><p>${esc(st.address)}<br>${esc(st.phone)}</p><hr>
    <div>Receipt #${s.id}</div><div>${new Date(s.date).toLocaleString()}</div><div>Cashier: ${esc(s.cashier)}</div><hr>
    ${s.items.map(i => `<div class="l"><span>${esc(i.name)} x${i.qty}</span><span>${(i.price*i.qty).toFixed(2)}</span></div>`).join('')}<hr>
    <div class="l"><span>Subtotal</span><span>${s.sub.toFixed(2)}</span></div><div class="l"><span>Discount</span><span>-${s.discAmt.toFixed(2)}</span></div>
    <div class="l"><span>VAT incl.</span><span>${s.tax.toFixed(2)}</span></div><div class="l"><b>TOTAL</b><b>${s.total.toFixed(2)}</b></div>
    <div class="l"><span>${s.method} paid</span><span>${s.paid.toFixed(2)}</span></div><div class="l"><span>Change</span><span>${s.change.toFixed(2)}</span></div><hr><p>Thank you for shopping!</p></div>
    <div class="acts"><button class="sec" onclick="closeM()">Close</button><button onclick="window.print()">Print</button></div>`);
}

/* ---- Sales (admin: all, cashier: own only) ---- */
R.sales = () => {
  const a = isAdmin(), list = db.sales.filter(s => a || s.cashierId === me.id).slice().reverse();
  const sum = list.reduce((x,s) => x + s.total, 0);
  $('#main').innerHTML = `<h2>${a?'All Sales':'My Sales'}</h2><div class="cards"><div class="stat">Transactions<b>${list.length}</b></div><div class="stat">Total<b>${money(sum)}</b></div></div>
    <div class="card tw"><table><tr><th>#</th><th>Date</th><th>Cashier</th><th>Items</th><th>Method</th><th>Total</th><th></th></tr>
    ${list.map(s => `<tr><td>${s.id}</td><td>${new Date(s.date).toLocaleString()}</td><td>${esc(s.cashier)}</td><td>${s.items.reduce((x,i)=>x+i.qty,0)}</td><td>${s.method}</td><td>${money(s.total)}</td>
    <td><button class="sm sec" onclick="receipt(db.sales.find(x=>x.id==${s.id}))">Receipt</button></td></tr>`).join('') || '<tr><td colspan=7>No sales yet</td></tr>'}</table></div>`;
};

/* ---- Settings (admin) ---- */
R.settings = () => {
  const s = db.settings;
  $('#main').innerHTML = `<h2>Settings</h2><div class="card" style="max-width:520px"><form id="sf">
    <label>Shop Name</label><input name="name" value="${esc(s.name)}"><label>Address</label><input name="address" value="${esc(s.address)}">
    <label>Phone</label><input name="phone" value="${esc(s.phone)}"><label>VAT %</label><input name="tax" type="number" step="0.1" value="${s.tax}">
    <label>Currency</label><input name="currency" value="${esc(s.currency)}"><div class="acts"><button>Save Settings</button></div></form></div>
    <div class="card"><h3>Database</h3><div class="acts" style="justify-content:flex-start"><button class="sec" onclick="exportDB()">Export Backup</button>
    <button class="bad" onclick="if(confirm('Reset ALL data?')){db=seed();save();logout()}">Reset Database</button></div></div>`;
  $('#sf').onsubmit = e => { e.preventDefault(); const f = e.target; db.settings = {name:f.name.value, address:f.address.value, phone:f.phone.value, tax:Number(f.tax.value), currency:f.currency.value}; save(); $('#shop').textContent = db.settings.name; alert('Saved'); };
};
function exportDB(){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'})); a.download = 'supermart-backup.json'; a.click(); }

$('#lp').onkeydown = e => { if(e.key === 'Enter') login(); };
</script>
</body>
